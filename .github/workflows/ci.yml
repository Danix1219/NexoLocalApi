name: CI

# Canalizacion de producto: estilo, dependencias, compilacion y pruebas.
#
# Existe aparte de `sdd.yml` porque aquel valida la documentacion y solo arrastra el build
# como dependencia; quien mira la lista de checks de un PR no deberia tener que saberlo.
# Estos son los nombres que se exigen en la proteccion de rama (ver docs/ci-cd.md).

on:
  pull_request:
    branches: [develop, main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estilo:
    name: CI / estilo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 verified from official repository
        with:
          global-json-file: global.json

      # Formato y convenciones de `.editorconfig`. No reformatea: falla y senala el archivo,
      # para que el arreglo quede en el commit de quien lo rompio y no en uno de la CI.
      - name: Formato y convenciones
        run: dotnet format src/Nexo.sln --verify-no-changes --verbosity diagnostic

  dependencias:
    name: CI / dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 verified from official repository
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore src/Nexo.sln

      # `dotnet list` siempre sale con 0, tambien cuando encuentra algo: hay que leer la salida.
      # Incluye las transitivas porque asi llego la ultima: Snappier dentro de MongoDB.Driver.
      - name: Paquetes con vulnerabilidades conocidas
        run: |
          set -euo pipefail
          dotnet list src/Nexo.sln package --vulnerable --include-transitive > vulnerables.txt
          cat vulnerables.txt
          # `dotnet` antepone "> " a cada paquete vulnerable y no usa ese marcador para nada mas.
          # Buscar la severidad por palabra suelta no sirve: "following" contiene "low".
          if grep -qE '^[[:space:]]*>' vulnerables.txt; then
            echo "::error::Hay paquetes con vulnerabilidades conocidas; revisar la salida."
            exit 1
          fi

  infraestructura:
    name: CI / infraestructura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Sin `hashicorp/setup-terraform`: la politica del repositorio solo admite acciones propias
      # o de GitHub. El runner no trae Terraform, asi que se baja el binario con su version y su
      # huella clavadas; una descarga alterada o a medias no pasa de aqui.
      - name: Instalar Terraform
        env:
          TF_VERSION: 1.9.8
          TF_SHA256: 186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8
        run: |
          set -euo pipefail
          archivo="terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archivo" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/${archivo}"
          echo "${TF_SHA256}  $RUNNER_TEMP/$archivo" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/$archivo" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/terraform" /usr/local/bin/terraform
          terraform version

      - name: Formato
        run: terraform -chdir=infra/terraform fmt -check -recursive

      # `-backend=false` descarga los proveedores sin tocar el estado remoto: la validacion no
      # necesita credenciales de Azure ni puede modificar nada.
      - name: Inicializar sin backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Validar
        run: terraform -chdir=infra/terraform validate

  # Compilacion, fronteras entre dominios y pruebas. Reutiliza el mismo workflow que usan
  # `sdd.yml` y el despliegue, para que los tres comprueben exactamente lo mismo.
  build:
    name: CI / build y pruebas
    uses: ./.github/workflows/backend-base.yml
