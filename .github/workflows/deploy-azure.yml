name: Deploy Azure

# Despliegue del contenedor Linux de cada servicio a Azure Container Apps.
# Sin secretos en el repositorio: la entrada a Azure es OIDC (federated credential) y la cadena de
# Mongo vive como secret de la Container App, cargada una sola vez por runbook (specs/CI-CD/cd-01/spec.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  base:
    name: Backend / build
    uses: ./.github/workflows/backend-base.yml

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produccion
    strategy:
      fail-fast: false
      matrix:
        # Un servicio por entrada; se agregan S02..S08 cuando tengan endpoints desplegables.
        include:
          - service: identity
            app: ca-nexolocal-identity
            dockerfile: services/identity/src/Api/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push image
        run: |
          set -euo pipefail
          image="${{ vars.AZURE_ACR_NAME }}.azurecr.io/nexolocal-${{ matrix.service }}:${GITHUB_SHA}"
          docker build --platform linux/amd64 -f "${{ matrix.dockerfile }}" -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_ENV"

      - name: Update Container App
        run: |
          set -euo pipefail
          az containerapp update \
            --name "${{ matrix.app }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$image" \
            --revision-suffix "sha${GITHUB_SHA:0:7}"

      - name: Verify revision health
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show --name "${{ matrix.app }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/health/ready" || true)
            if [ "$code" = "200" ]; then echo "DEPLOY-OK https://$fqdn"; exit 0; fi
            sleep 10
          done
          echo "La revision no alcanzo 200 en /health/ready; revisar logs de la Container App." >&2
          exit 1
