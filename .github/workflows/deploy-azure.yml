name: Deploy Azure

# nv-00 T-015 / NFR-004: UNA API modular en UN App Service plan B1 con DOS instancias.
# Sustituye el despliegue anterior de Container Apps por servicio (un plan por servicio costaba
# ~208 USD/mes contra 100 USD de credito; esta forma cuesta ~26 USD/mes, enmienda E-001 y D-1).
#
# Un solo proceso: el despachador de outbox corre dentro de la propia API. Con dos instancias
# no hay envios duplicados: el outbox reclama cada mensaje con una actualizacion condicional.
#
# La publicacion usa el perfil del sitio, guardado como secreto de GitHub. La cadena de Mongo y
# el resto de la configuracion viven como app settings del App Service, cargadas una sola vez
# por runbook (specs/CI-CD/cd-01/spec.md); nada de eso se versiona.
#
# DEUDA: el plan B1 y sus dos instancias ya no se declaran aqui. El perfil de publicacion solo
# autoriza subir al sitio, no operar la suscripcion, de modo que `AC-010` deja de comprobarse
# en cada despliegue y el plan depende de la configuracion del portal. Recuperarlo exige OIDC:
# una aplicacion en Entra ID, una credencial federada y un permiso sobre el grupo de recursos.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  base:
    name: Backend / build
    uses: ./.github/workflows/backend-base.yml

  deploy:
    name: Deploy API (B1 x2)
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produccion
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 verified from official repository
        with:
          global-json-file: global.json

      - name: Publish host
        run: dotnet publish src/Host/Nexo.Host --configuration Release --output publish

      # Despliegue con el perfil de publicacion del sitio, el mismo que usa Visual Studio.
      #
      # No se usa OIDC porque exige registrar una aplicacion en Entra ID, una credencial federada
      # y un permiso sobre el grupo de recursos; para este proyecto no compensa. El coste de
      # elegir el perfil esta anotado abajo y en Memoria.md.
      #
      # El perfil lleva usuario y contrasena, asi que la contrasena se enmascara en cuanto se lee:
      # sin eso, cualquier comando posterior que la imprimiera la dejaria en el registro publico.
      - name: Desplegar con el perfil de publicacion
        env:
          PERFIL: ${{ secrets.AZURE_BACKAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "${PERFIL:-}" ]; then
            echo "::error::Falta el secreto AZURE_BACKAPP_PUBLISH_PROFILE."
            exit 1
          fi

          printf %s "$PERFIL" > perfil.xml
          usuario=$(python3 -c "import xml.etree.ElementTree as ET;p=[x for x in ET.parse('perfil.xml').getroot().iter('publishProfile') if x.get('publishMethod')=='MSDeploy'][0];print(p.get('userName'))")
          clave=$(python3 -c "import xml.etree.ElementTree as ET;p=[x for x in ET.parse('perfil.xml').getroot().iter('publishProfile') if x.get('publishMethod')=='MSDeploy'][0];print(p.get('userPWD'))")
          host=$(python3 -c "import xml.etree.ElementTree as ET;p=[x for x in ET.parse('perfil.xml').getroot().iter('publishProfile') if x.get('publishMethod')=='MSDeploy'][0];print(p.get('publishUrl'))" | cut -d: -f1)
          rm -f perfil.xml

          # Antes que nada: si algun comando imprimiera la clave, ya esta tapada.
          echo "::add-mask::$clave"

          (cd publish && zip -qr ../publish.zip .)
          curl -fsS -X POST --retry 3 -u "$usuario:$clave" -H "Content-Type: application/zip" --data-binary @publish.zip "https://$host/api/zipdeploy"

      - name: Verify readiness on both instances
        run: |
          set -euo pipefail
          host="${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          ok=0
          # Varias peticiones para que el balanceador reparta entre las dos instancias:
          # una sola respuesta 200 no prueba que ambas esten sanas (NFR-003).
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/health/ready" || true)
            if [ "$code" = "200" ]; then ok=$((ok + 1)); fi
            if [ "$ok" -ge 6 ]; then echo "DEPLOY-OK https://$host"; exit 0; fi
            sleep 10
          done
          echo "No se alcanzaron 6 respuestas 200 en /health/ready; revisar el log del App Service." >&2
          exit 1
