name: Deploy Azure

# nv-00 T-015 / NFR-004: UNA API modular en UN App Service plan B1 con DOS instancias.
# Sustituye el despliegue anterior de Container Apps por servicio (un plan por servicio costaba
# ~208 USD/mes contra 100 USD de credito; esta forma cuesta ~26 USD/mes, enmienda E-001 y D-1).
#
# Un solo proceso: el despachador de outbox corre dentro de la propia API. Con dos instancias
# no hay envios duplicados: el outbox reclama cada mensaje con una actualizacion condicional.
#
# Sin secretos en el repositorio: la entrada a Azure es OIDC y la cadena de Mongo vive como
# app setting del App Service, cargada una sola vez por runbook (specs/CI-CD/cd-01/spec.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAN_SKU: B1
  PLAN_INSTANCES: 2

jobs:
  base:
    name: Backend / build
    uses: ./.github/workflows/backend-base.yml

  deploy:
    name: Deploy API (B1 x2)
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produccion
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 verified from official repository
        with:
          global-json-file: global.json

      - name: Publish host
        run: dotnet publish src/Host/Nexo.Host --configuration Release --output publish

      # Sin `azure/login`: la politica del repositorio solo admite acciones propias o de GitHub.
      # El intercambio OIDC son tres llamadas y el runner ya trae `az`, asi que no hace falta
      # ninguna accion de terceros. Sigue sin haber contrasena guardada en ningun sitio: GitHub
      # emite un token de corta vida para esta ejecucion y Azure lo cambia por una sesion.
      - name: Azure login (OIDC)
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')
          # Oculta el token en el registro aunque algun comando posterior lo imprima.
          echo "::add-mask::$token"
          az login --service-principal \
            --username "$CLIENT_ID" --tenant "$TENANT_ID" --federated-token "$token" --output none
          az account set --subscription "$SUBSCRIPTION_ID"

      # Un plan, un sku B1, dos instancias. Declarado aqui para que el despliegue sea reproducible
      # y no dependa de un ajuste manual en el portal (NFR-004, AC-010).
      - name: Enforce plan B1 with two instances
        run: |
          set -euo pipefail
          az appservice plan update \
            --name "${{ vars.AZURE_PLAN_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --sku "${PLAN_SKU}" \
            --number-of-workers "${PLAN_INSTANCES}"
          az webapp config set \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --always-on true

      # Sin `azure/webapps-deploy`, por el mismo motivo. `az webapp deploy` hace lo mismo:
      # sube el zip y reinicia el sitio.
      - name: Deploy to App Service
        run: |
          set -euo pipefail
          (cd publish && zip -qr ../publish.zip .)
          az webapp deploy \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --src-path publish.zip --type zip --async false

      - name: Verify readiness on both instances
        run: |
          set -euo pipefail
          host="${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          ok=0
          # Varias peticiones para que el balanceador reparta entre las dos instancias:
          # una sola respuesta 200 no prueba que ambas esten sanas (NFR-003).
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/health/ready" || true)
            if [ "$code" = "200" ]; then ok=$((ok + 1)); fi
            if [ "$ok" -ge 6 ]; then echo "DEPLOY-OK https://$host"; exit 0; fi
            sleep 10
          done
          echo "No se alcanzaron 6 respuestas 200 en /health/ready; revisar el log del App Service." >&2
          exit 1
