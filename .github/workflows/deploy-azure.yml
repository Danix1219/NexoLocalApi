name: Deploy Azure

# nv-00 T-015 / NFR-004: UNA API modular en UN App Service plan B1 con DOS instancias.
# Sustituye el despliegue anterior de Container Apps por servicio (un plan por servicio costaba
# ~208 USD/mes contra 100 USD de credito; esta forma cuesta ~26 USD/mes, enmienda E-001 y D-1).
#
# Un solo proceso: el despachador de outbox corre dentro de la propia API. Con dos instancias
# no hay envios duplicados: el outbox reclama cada mensaje con una actualizacion condicional.
#
# La publicacion usa el perfil del sitio, guardado como secreto de GitHub. La cadena de Mongo y
# el resto de la configuracion viven como app settings del App Service, cargadas una sola vez
# por runbook (specs/CI-CD/cd-01/spec.md); nada de eso se versiona.
#
# DEUDA: el plan B1 y sus dos instancias ya no se declaran aqui. El perfil de publicacion solo
# autoriza subir al sitio, no operar la suscripcion, de modo que `AC-010` deja de comprobarse
# en cada despliegue y el plan depende de la configuracion del portal. Recuperarlo exige OIDC:
# una aplicacion en Entra ID, una credencial federada y un permiso sobre el grupo de recursos.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  base:
    name: Backend / build
    uses: ./.github/workflows/backend-base.yml

  deploy:
    name: Deploy API (B1 x2)
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produccion
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v5 verified from official repository
        with:
          global-json-file: global.json

      # La version se sella en el ensamblado y la API la publica en `info.version` del documento
      # OpenAPI, de modo que se puede comprobar que version esta viva sin entrar al portal.
      # El SHA va en `InformationalVersion` y no en la version del paquete: distingue dos
      # despliegues de la misma version sin ensuciar el numero que lee una persona.
      - name: Publish host
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          echo "NEXO_VERSION=$version" >> "$GITHUB_ENV"
          dotnet publish src/Host/Nexo.Host --configuration Release --output publish \
            -p:Version="$version" -p:InformationalVersion="$version+${GITHUB_SHA::7}"

      # Despliegue con el perfil de publicacion del sitio, el mismo que usa Visual Studio.
      #
      # No se usa OIDC porque exige registrar una aplicacion en Entra ID, una credencial federada
      # y un permiso sobre el grupo de recursos; para este proyecto no compensa. El coste de
      # elegir el perfil esta anotado abajo y en Memoria.md.
      #
      # El perfil lleva usuario y contrasena, asi que la contrasena se enmascara en cuanto se lee:
      # sin eso, cualquier comando posterior que la imprimiera la dejaria en el registro publico.
      - name: Desplegar con el perfil de publicacion
        env:
          PERFIL: ${{ secrets.AZURE_BACKAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "${PERFIL:-}" ]; then
            echo "::error::Falta el secreto AZURE_BACKAPP_PUBLISH_PROFILE."
            exit 1
          fi

          printf %s "$PERFIL" > perfil.xml
          usuario=$(python3 -c "import xml.etree.ElementTree as ET;p=[x for x in ET.parse('perfil.xml').getroot().iter('publishProfile') if x.get('publishMethod')=='MSDeploy'][0];print(p.get('userName'))")
          clave=$(python3 -c "import xml.etree.ElementTree as ET;p=[x for x in ET.parse('perfil.xml').getroot().iter('publishProfile') if x.get('publishMethod')=='MSDeploy'][0];print(p.get('userPWD'))")
          host=$(python3 -c "import xml.etree.ElementTree as ET;p=[x for x in ET.parse('perfil.xml').getroot().iter('publishProfile') if x.get('publishMethod')=='MSDeploy'][0];print(p.get('publishUrl'))" | cut -d: -f1)
          # La URL publica sale del propio perfil. Componerla como "<nombre>.azurewebsites.net"
          # ya no vale: Azure anade un sufijo unico al dominio por omision.
          publica=$(python3 -c "import xml.etree.ElementTree as ET;p=[x for x in ET.parse('perfil.xml').getroot().iter('publishProfile') if x.get('publishMethod')=='MSDeploy'][0];print(p.get('destinationAppUrl'))")
          echo "APP_URL=${publica%/}" >> "$GITHUB_ENV"
          rm -f perfil.xml

          # Antes que nada: si algun comando imprimiera la clave, ya esta tapada.
          echo "::add-mask::$clave"

          (cd publish && zip -qr ../publish.zip .)
          curl -fsS -X POST --retry 3 -u "$usuario:$clave" -H "Content-Type: application/zip" --data-binary @publish.zip "https://$host/api/zipdeploy"

      # Repite la sonda porque una sola respuesta no prueba nada cuando hay varias
      # instancias: el balanceador podria estar mandandolas todas a la misma.
      - name: Verificar que el sitio responde
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::El perfil de publicacion no trae destinationAppUrl."
            exit 1
          fi
          ok=0
          # Varias peticiones para que el balanceador reparta entre las dos instancias:
          # una sola respuesta 200 no prueba que ambas esten sanas (NFR-003).
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/health/ready" || true)
            if [ "$code" = "200" ]; then ok=$((ok + 1)); fi
            if [ "$ok" -ge 6 ]; then echo "DEPLOY-OK $APP_URL"; exit 0; fi
            sleep 10
          done
          echo "No se alcanzaron 6 respuestas 200 en $APP_URL/health/ready; revisar el log del App Service." >&2
          exit 1

      # La etiqueta se crea solo si el sitio respondio: etiquetar antes dejaria marcada como
      # entregada una version que no llego a levantar.
      # Se usa la API y no `git push` porque el checkout no conserva credenciales.
      - name: Etiquetar la version entregada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          etiqueta="api-v${NEXO_VERSION}"
          codigo=$(curl -sS -o respuesta.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "{\"ref\":\"refs/tags/${etiqueta}\",\"sha\":\"${GITHUB_SHA}\"}")

          if [ "$codigo" = "201" ]; then
            estado="creada"
          elif [ "$codigo" = "422" ]; then
            # Ya existe: una repromocion de la misma version no es un error.
            estado="ya existia"
          else
            echo "::error::No se pudo crear la etiqueta ${etiqueta} (HTTP ${codigo})."
            cat respuesta.json
            exit 1
          fi

          {
            echo "## Despliegue"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${NEXO_VERSION}\` |"
            echo "| Etiqueta | \`${etiqueta}\` (${estado}) |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| URL | ${APP_URL} |"
            echo
            echo "Comprobar la version viva en \`${APP_URL}/openapi/v1.json\`, campo \`info.version\`."
          } >> "$GITHUB_STEP_SUMMARY"
