name: Backend base
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-base-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Backend / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 verified from official repository
        with:
          global-json-file: global.json
      - name: Restore enabled projects
        run: dotnet restore nexolocal.Api.slnx
      - name: Compile enabled projects
        run: dotnet build nexolocal.Api.slnx --no-restore --configuration Release
      - name: Check project boundaries
        run: python3 -B scripts/check_architecture.py
      - name: Test architecture validator
        run: python3 -B -m unittest discover -s tests/Architecture -p 'test_*.py' -v
      - name: Smoke all scaffold hosts
        shell: pwsh
        run: ./scripts/Test-ScaffoldHosts.ps1
